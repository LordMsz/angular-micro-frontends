server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    # SPA fallback: paths that aren't files (deep links like /dashboard) get index.html,
    # and the Angular router resolves them client-side. Without it: 404 on reload.
    try_files $uri $uri/ /index.html;
  }
}
